<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Test - {{ practice.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #f8fafc;
            --border-color: #000000;
            --primary: #10b981;
            --accent-cyan: #10b981;
            --text-main: #000000;
            --text-muted: #52525b;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        .header {
            height: 64px;
            background: #ffffff;
            border-bottom: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timer-chip {
            font-family: 'JetBrains Mono', monospace;
            background: #000000;
            color: #10b981;
            border: 1.5px solid #000000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-stage {
            display: flex;
            height: calc(100vh - 64px);
            background: #ffffff;
        }
        .question-col {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        .palette-col {
            width: 300px;
            background: #ffffff;
            border-left: 2px solid #000000;
            padding: 20px;
            overflow-y: auto;
            color: #000000;
        }

        .q-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 16px;
            padding: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            color: #000000;
        }
        .q-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 600;
            color: #000000;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-item {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1.5px solid #000000;
            border-radius: 12px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #000000;
        }
        .option-item:hover {
            border-color: #10b981;
            background: #f0fdf4;
        }
        .option-item.selected {
            border-color: #10b981;
            background: #dcfce7;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
        }
        .option-bullet {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #000000;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }
        .option-item.selected .option-bullet {
            border-color: #10b981;
            background: #10b981;
        }

        /* Hint Box */
        .hint-box {
            background: #f0fdf4;
            border: 1.5px dashed #10b981;
            border-radius: 10px;
            padding: 14px 18px;
            margin-top: 14px;
            font-size: 0.88rem;
            color: #065f46;
            display: none;
            font-weight: 500;
        }

        /* Controls */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-act {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid #000000;
            background: #ffffff;
            color: #000000;
            transition: all 0.2s ease;
        }
        .btn-act:hover {
            background: #000000;
            color: #ffffff;
        }
        .btn-act-primary {
            background: #10b981;
            color: #ffffff;
            border: none;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-act-primary:hover {
            background: #059669;
            color: #ffffff;
        }

        /* Palette Grid */
        .pal-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 14px;
        }
        .pal-tile {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            background: #ffffff;
            border: 1.5px solid #000000;
            color: #000000;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pal-tile.active { outline: 2.5px solid #10b981; color: #000000; }
        .pal-tile.answered { background: #10b981; border-color: #10b981; color: #ffffff; font-weight: 800; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">
            <i class="fas fa-brain text-success" style="color: #ffffff;"></i>
            <span>{{ practice.title }}</span>
            <span style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">({{ practice.subject }})</span>
        </div>

        <div class="timer-chip">
            <i class="far fa-clock"></i>
            <span id="timerText">00:00</span>
        </div>

        <div>
            <button type="button" class="btn-act btn-act-primary" onclick="submitPractice()">
                <i class="fas fa-check-circle"></i> Complete Practice
            </button>
        </div>
    </header>

    <div class="main-stage">
        <!-- Question Stage -->
        <div class="question-col">
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                <span style="font-weight: 700; color: #ffffff;" id="qNumberDisplay">Question 1</span>
                <div>
                    <button type="button" class="btn-act" style="padding: 6px 12px; font-size: 0.8rem;" onclick="toggleHint()">
                        <i class="fas fa-lightbulb" style="color: #ffffff;"></i> Clue / Hint
                    </button>
                </div>
            </div>

            <div class="q-card">
                <div class="q-text" id="qStatement">Loading question...</div>
                <div id="qOptionsArea"></div>
                <div class="hint-box" id="hintBox"></div>
            </div>

            <div class="action-bar">
                <button type="button" class="btn-act" id="btnPrev" onclick="nav(-1)">Previous</button>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-act" onclick="clearAns()">Clear</button>
                    <button type="button" class="btn-act btn-act-primary" id="btnNext" onclick="nav(1)">Next</button>
                </div>
            </div>
        </div>

        <!-- Palette Col -->
        <div class="palette-col">
            <h4 style="margin: 0 0 10px 0; color: #fff;">Questions Overview</h4>
            <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px;">
                Answered: <strong style="color: #ffffff;" id="answeredCount">0</strong> / {{ questions|length }}
            </div>
            <div class="pal-grid" id="paletteGrid"></div>
        </div>
    </div>

    <!-- Hidden Form -->
    <form id="practiceSubmitForm" action="{{ url_for('submit_practice_test', practice_id=practice.id) }}" method="POST" style="display: none;">
        <input type="hidden" name="answers_json" id="formAnswersJson" value="{}">
        <input type="hidden" name="time_spent_seconds" id="formTimeSpent" value="0">
    </form>

    <script id="q-data" type="application/json">
        {{ questions|tojson|safe }}
    </script>

    <script>
        const questions = JSON.parse(document.getElementById('q-data').textContent);
        let currentIndex = 0;
        let answers = {};
        let timeElapsed = 0;

        // Timer
        setInterval(() => {
            timeElapsed++;
            const m = Math.floor(timeElapsed / 60);
            const s = timeElapsed % 60;
            document.getElementById('timerText').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);

        function renderPalette() {
            const g = document.getElementById('paletteGrid');
            g.innerHTML = '';
            questions.forEach((q, i) => {
                const t = document.createElement('div');
                t.className = 'pal-tile';
                t.id = `pal-${i}`;
                t.textContent = i + 1;
                t.onclick = () => loadQuestion(i);
                if (answers[i]) t.classList.add('answered');
                if (i === currentIndex) t.classList.add('active');
                g.appendChild(t);
            });
            const ansCount = Object.keys(answers).filter(k => answers[k] !== "").length;
            document.getElementById('answeredCount').textContent = ansCount;
        }

        function loadQuestion(idx) {
            currentIndex = idx;
            const q = questions[idx];
            document.getElementById('qNumberDisplay').textContent = `Question ${idx + 1} of ${questions.length} • Topic: ${q.topic || 'Core'}`;
            document.getElementById('qStatement').textContent = q.question;

            const area = document.getElementById('qOptionsArea');
            area.innerHTML = '';
            const hintBox = document.getElementById('hintBox');
            hintBox.style.display = 'none';
            hintBox.textContent = q.explanation ? `Hint: ${q.explanation.slice(0, 100)}...` : 'Review the fundamental laws related to this topic.';

            if (q.options && q.options.length > 0) {
                const list = document.createElement('div');
                list.className = 'options-list';
                q.options.forEach((opt, oIdx) => {
                    const letter = String.fromCharCode(65 + oIdx);
                    const item = document.createElement('div');
                    item.className = 'option-item';
                    if (answers[currentIndex] === letter) item.classList.add('selected');

                    item.innerHTML = `
                        <div class="option-bullet"></div>
                        <div style="font-weight: 700; color: #ffffff; margin-right: 10px;">${letter}.</div>
                        <div>${opt}</div>
                    `;
                    item.onclick = () => {
                        answers[currentIndex] = letter;
                        loadQuestion(currentIndex);
                    };
                    list.appendChild(item);
                });
                area.appendChild(list);
            } else {
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.style.width = '100%';
                inp.style.padding = '12px';
                inp.style.background = 'rgba(0,0,0,0.3)';
                inp.style.border = '1px solid rgba(255,255,255,0.1)';
                inp.style.borderRadius = '8px';
                inp.style.color = 'white';
                inp.placeholder = 'Type response...';
                inp.value = answers[currentIndex] || '';
                inp.oninput = (e) => {
                    answers[currentIndex] = e.target.value;
                    renderPalette();
                };
                area.appendChild(inp);
            }

            document.getElementById('btnPrev').disabled = idx === 0;
            document.getElementById('btnNext').textContent = idx === questions.length - 1 ? 'Finish' : 'Next';

            renderPalette();
        }

        function nav(step) {
            const next = currentIndex + step;
            if (next >= 0 && next < questions.length) {
                loadQuestion(next);
            } else if (next >= questions.length) {
                submitPractice();
            }
        }

        function clearAns() {
            delete answers[currentIndex];
            loadQuestion(currentIndex);
        }

        function toggleHint() {
            const h = document.getElementById('hintBox');
            h.style.display = h.style.display === 'block' ? 'none' : 'block';
        }

        function submitPractice() {
            if (confirm("Do you want to complete and view your AI Learning Analytics scorecard?")) {
                document.getElementById('formAnswersJson').value = JSON.stringify(answers);
                document.getElementById('formTimeSpent').value = timeElapsed;
                document.getElementById('practiceSubmitForm').submit();
            }
        }

        // Initialize
        loadQuestion(0);
    </script>
</body>
</html>
