<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Career Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="card login-card glass">
            <div class="login-header">
                <h2>Reset Password</h2>
                <p>Enter your email to receive a reset link.</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. john@example.com" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary btn-large" style="margin-top: 30px;">Send Reset Link</button>
            </form>
            <div style="text-align: center; margin-top: 20px;">
                <p style="color: var(--text-muted); font-size: 0.95rem;"><a href="{{ url_for('login') }}" style="color: #10b981; font-weight: 700; text-decoration: none;">&larr; Back to login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
